apiBaseUrl=API Base URL
apiBaseUrlHelp=...
apiClientId=API Auth client_id
apiClientIdHelp=As which client the API-client should authenticate itself.
editMode=Edit mode
editModeHelp=READ_ONLY is a read-only store. WRITABLE means data will be synced back to the source on demand.
supportedCredentialTypes=Supported credential types
supportedCredentialTypesHelp=The types of credentials that are supported by this provider, e.g. password, otp, etc.
trustEmail=Trust email
trustEmailHelp=Treat email addresses coming from this provider as verified, regardless of what the source says.
attributeMappings=Attribute mappings
attributeMappingsHelp=JSON array mapping fields of the external user record to Keycloak user attributes. Each entry takes "name" (Keycloak attribute) and "field" (external field), plus the optional "type" (string, integer, long, boolean, json), "multivalued", "readOnly", "delimiter", "property" (map a single member out of a complex object) and "group" (a user profile attribute group, which must be declared in the realm). Example: [{"name": "picture", "field": "pictureUrl"}]
